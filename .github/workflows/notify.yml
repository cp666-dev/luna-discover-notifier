# Checks LUNA's Discover list about every 10 minutes and posts new and updated Add Ons to
# Discord, and once a day an Add On of the Day to Slack. state.json remembers what has been announced; this job commits it back.
name: Discover notifier

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check Discover and post
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ vars.DISCORD_ROLE_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MENTION: ${{ vars.SLACK_MENTION }}
          DAILY_HOUR: ${{ vars.DAILY_HOUR }}
          DAILY_TZ: ${{ vars.DAILY_TZ }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node notify.mjs
      - name: Save state
        # Runs after a partial failure too, so what did post is not posted twice.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- state.json || ! git ls-files --error-unmatch state.json >/dev/null 2>&1; then
              git add state.json
              git commit -m "Update Discover state"
              git push
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
              # GitHub turns off schedules after 60 days without a commit.
              git commit --allow-empty -m "Keep the schedule alive"
              git push
          fi
      - name: Queue the next check
        # GitHub runs the schedule above hours late on quiet repos, so each run starts the
        # next one itself; the schedule only restarts the chain if it ever breaks. The
        # concurrency group keeps at most one run waiting, so chains never pile up.
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 600
          # GitHub's API sometimes times out; a second dispatch is harmless.
          for wait in 10 30 60 120 0; do
              gh workflow run notify.yml --repo "$GITHUB_REPOSITORY" --ref main && exit 0
              sleep "$wait"
          done
          exit 1
